"Açık meşe raf sistemi","Kara döküm kuzine + fırın","Ada tezgah 80x160cm masif kayın","Pencere önü herb saksıları"],img:Yl},{id:"ana-yatak",no:"04",title:"Ana Yatak Odası",subtitle:"3.2 x 3.5m — Floral Rüya",desc:"Kütük duvarlar burada daha da sıcak. Floral yatak örtüsü — küçük gül desenli, İngiliz kumaşı — yün battaniye ile katlanmış. Pencere sediri tam bahçeye bakıyor, minderleri keten. Meşe gardırop, kapağında minik bir ayna. Sabah uyanınca ilk gördüğün şey: bahçedeki elma ağacı ve sisli orman ucu. Taş ev serindi, burası kucak gibi.",details:["Kütük duvar + pencere sediri","Floral yatak + yün battaniye","Meşe gardırop + komodin","Bahçe + orman manzarası"],img:eo},{id:"misafir",no:"05",title:"Misafir Odası / Çalışma",subtitle:"2.8 x 3m — Alçak Kirişli Sığınak",desc:"Tavan biraz alçak, kirişler elini uzatsan değecek kadar yakın — bilerek öyle. İskandinav sığınağı gibi. Bir duvarda meşe yazı masası, üzerinde seramik lamba. Tek kişilik yatak, gündüzleri divan oluyor. Misafir gelince yatak, gelmeyince senin okuma köşen. Duvara çakılmış kancada hasır şapka, yerde jüt kilim.",details:["Alçak kirişli tavan 2.1m","Meşe yazı masası + divan yatak","Jüt kilim + keten perde","Çalışma / misafir / kütüphane"],img:eo},{id:"banyo",no:"06",title:"Banyo",subtitle:"Orman Manzaralı Küvet — En Büyük Fark",desc:"İşte taş evden ayrıldığımız yer. Taş evde lavanta tarlası vardı, burada çam ormanı. Büyük pencere — yerden tavana yakın — serbest küvet tam karşısına yerleşiyor. Pirinç batarya, ahşap bambu çerçeveli ayna, keten havlular. Mum yanarken buhar camda, dışarıda çamlar rüzgarda. Yerden ısıtma var, kışın çıplak ayak üşümüyor. Burası spa değil, orman banyosu.",details:["Serbest küvet + orman manzaralı pencere","Pirinç batarya + ahşap dolap","Yerden ısıtma + nefes alan membran","Keten havlu + bal mumu mum"],img:Na},{id:"bahce",no:"07",title:"Bahçe",subtitle:"Wisteria Pergola & Yaşayan Toprak",desc:"Ön bahçe: David Austin gülleri, lavanta, yüksük otu — taş patika aralarından geçiyor. Ark
