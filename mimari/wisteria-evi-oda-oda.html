p kitap okursun, bacaklarını toplar. Kirişler 20×20 İngiliz meşesi, el yontması izi hala durur. Tavan 2.7 metre ama kirişler alçaltır, sarar sarmalar. Duvarlar kireç sıva, ışığı yumuşatır, hiç keskin gölge yok. Yerde jüt halı, üstünde keten kanepe — hep biraz dağınık, hep davetkâr. Yaz akşamı pencereler açık, bahçeden Gertrude Jekyll güllerinin kokusu dolar içeri, arılar vızıldar, sen şömine rafındaki mumu yakmazsın bile.",details:["Cotswold taş şömine, tek parça meşe raf, gizli LED","Derin pencere nişi: 60cm duvar + minder + keten perde","Meşe kirişler, fırınlanmış, bal rengi koyulaşan","Keten kanepe, jüt halı, geri kazanılmış meşe sehpa","Kitaplık: duvara gömme, meşe, üç raf, hep dolu"],mood:"Ateşin başında çay. Dışarıda yağmur taşlara vurur.",color:"#f1e6d5"},{id:"mutfak",no:"03",title:"Mutfak",en:"Kitchen",size:"3 × 3.5 m · 10.5 m²",img:Ys,alt:"Aga kuzineli Cotswold mutfağı, meşe raflar ve ada tezgah",summary:"Krem Aga kuzinesi her zaman yanar — evin kalbi burası.",story:"Sabah 6'da Aga'nın kapağını açarsın, mutfak zaten sıcak. Krem emaye, 3 fırınlı, 100 yıllık tarifle dökülmüş. Üstünde her daim bir demlik, yanında ekşi maya. Açık meşe raflarda beyaz porselenler, hepsi farklı — köy pazarından toplama. Bir raf sadece baharat kavanozları: defne kendi bahçeden. Ortada 2.4 metrelik ada, masif meşe, köşeleri yuvarlatılmış, yıllarca kesme tahtası gibi kullanılmış, izleri durur. Ada altında hasır sepetler: soğan, patates, elmalar. Seramik lavabo derin, pirinç batarya, önünde pencereden bahçe görünür — bulaşık yıkarken lavantaları izlersin. Bahçeye açılan kapı siyah çelik, ince profilli, yazın hep aralık. Detaylar: duvarda bakır tavalar asılı, tezgâhta ekmek teknesi, taze ot demeti — rosemary, sage, thyme — keten bezde, yanında elma sepeti. Kokusu: kızarmış ekmek, odun dumanı, kekik.",details:["Aga kuzinesi, krem, 3 fırınlı, kış boyu açık, 8kW","Açık meşe raflar, el yapımı seramik askı","Seramik Belfast lavabo + yaşlanan pirinç batarya","Ada tezgah 2.4m meşe, taş değil — sıcak tutar","Siyah çelik bahçe kapısı, eşik yok, bahçeye akış","Ekmek teknesi meşe, taze ot demeti, elma sepeti Bramley"],mood:"Hamur mayalanır, çay demlenir, kapı aralık.",color:"#ece4d6"},{id:"ana-yatak",no:"04",title:"Ana Yatak Odası",en:"Primary Bedroom",size:"3.2 × 3.5 m · 11.2 m²",img:Vs,alt:"Bal rengi taş yatak odası, floral yatak örtüsü, pencere sediri ve meşe dolap",summary:"Sabah ışığı doğudan girer, bal rengi taşı ısıtır.",story:"Uyandığında ilk gördüğün şey pencere sediri. 60cm duvarın içine gömülü, üstünde yün minder, sırtında üç keten yastık. Perde yok, kepenk var — sabah kepengi itersin, ışık önce taş zemine, sonra yatağa düşer. Yatak, gül bahçesine bakar, başlığı yok, sadece duvara dayalı, üstünde floral örtü — küçük güller, soluk pembe, İngiliz kumaşı. Ayak ucunda yün örgü battaniye, anneanneden kalma gibi ağır. Karşıda meşe gardırop, kapağı sürgülü değil, açılır, içi sedir kokar, raflarında lavanta keseleri. Yerde geniş meşe kalas, yağlı, çıplak ayak sıcak. Duvarlarda tek bir şey: küçük bir suluboya, evin ilk çizimi. Akşam lambası pirinç, okuma ışığı duvara gömme, sarı. Burası sessiz — taş duvar sesi yutar. Dışarıda kuşlar, içeride nefes.",details:["Doğu penceresi, sabah ışığı 7-10 arası bal rengi duvara","Floral yatak örtüsü, yün örgü battaniye, keten yastık","Pencere sediri: meşe, minderli, kitap + çay için","Meşe gardırop, iç raflarda lavanta keseleri","Meşe zemin, yağlı, yerden ısıtma altında"],mood:"Sabah 7, gül kokusu, çay sesi mutfaktan.",color:"#f6e8d5"},{id:"misafir",no:"05",title:"Misafir / Çalışma",en:"Guest & Study",size:"2.8 × 3 m · 8.4 m²",summary:"Tavan arası gibi alçak kirişli, tek kişilik yatak + yazı masası.",story:"Bu oda evin en mahrem köşesi. Tavan kirişleri daha alçak, başını eğersin, bir anda çocuk olursun. Tek kişilik yatak, keten örtü, üstünde iki yastık — biri sert, biri yumuşak. Yanında küçük yazı masası, meşe, üstünde porselen mürekkep hokkası, birkaç mektup, bir vazoda tek bir gül. Pencere küçük, ama bahçenin en yabani köşesine bakar: yüksük otları, arı otları. Burayı misafir odası diye yaptık ama çoğu zaman çalışma odası. Kışın dikiş makinesi gelir, yazın suluboya. Duvara çakılı meşe raf, üstünde tohum zarfları etiketli. Okuma köşesi: hasır koltuk, ayak altında jüt puf, yanında yer lambası. Kapı kapanınca evin gürültüsü kesilir — sadece kalem sesi.",details:["Alçak kirişli tavan, 2.2m net, sarılır gibi","Tek kişilik yatak + yazı masası, meşe, 90cm","Okuma köşesi: hasır berjer + jüt puf + pirinç lamba","Duvara gömme raf: tohum zarfları, iplik makaraları","İkinci kullanım: dikiş odası, çalışma, misafir"],mood:"Kapı kapalı, kalem sesi, pencerede arı.",color:"#e9e1d2",alt:"Misafir odası eskiz detayı"},{id:"banyo",no:"06",title:"Banyo",en:"Bathroom",size:"2.5 × 3 m · 7.5 m²",img:Ws,alt:"Serbest aslan ayaklı küvet, lavanta tarlası manzaralı banyo, meşe lavabo",summary:"Serbest duran aslan ayaklı küvet, pencereden lavanta tarlası.",story:"Kapıyı açınca kireç ve lavanta kokar. Duvarlar yarıya kadar bal rengi taş, üstü kireç sıva — mala izli, dalgalı, ışığı dağıtan. Ortada aslan ayaklı küvet, beyaz emaye, dıştan da beyaz, ayakları meşe değil, döküm. Pirinç batarya, zamanla kararır, yeşillenir, onu seveceksin. Küveti doldurursun, pencereden bakarsın: lavanta tarlası değil tam olarak, bahçenin lavanta kenarı — Hidcote Blue, yaz boyu mor. Arılar cama vurur. Meşe lavabo dolabı, üstü mermer değil, taş — tek parça kireçtaşı, kenarı küt, lavabo üstü seramik, derin. Aynası yuvarlak, pirinç çerçeve, buğulanır. Sepetlerde havlular, keten, hafif nemli. Rafte doğal sabunlar: ballı, yulaflı, lavantalı — köydeki kadın yapıyor. Yerde terrazzo değil, kireçtaşı, altında yerden ısıtma, kışın çıplak ayak sıcak. Bu banyo acele sevmez.",details:["Aslan ayaklı küvet, serbest, 170cm, döküm + emaye","Pirinç batarya, el duşu, yaşlanan pirinç","Meşe lavabo dolabı + kireçtaşı tezgah, tek parça","Kireç sıva + taş duvar, nefes alan, buğu tutmaz","Pencere: lavanta kenarı manzarası, mahrem cam değil","Sepet havlular, doğal sabunlar, ahşap fırça"],mood:"Küvet dolu, pencere aralık, arı sesi.",color:"#e8ddd0"},{id:"bahce",no:"07",title:"Bahçe & Dış Mekan",en:"Garden & Patio",size:"42 m² bahçe + patio",img:bs,alt:"Taş patio, wisteria pergola altı kahvaltı masası ve mutfak bahçesi",summary:"Önce bahçe, sonra ev. 8×10 metrede ev 95m², kalanı gül.",story:"Evi bahçeden ayırma. Ön bahçe: taş patika, araları kekik ve papatya, basarsan kokar. İki yanında David Austin gülleri — Gertrude Jekyll mis kokulu, Wollerton Old Hall soluk sarı. Aralarında yüksük otu, mor, pembe, arı dolar. Girişte wisteria tüneli, Mayıs'ta mor salkımlar, kapıdan eve yürürken başın mor olur. Arka patio: taş masa, dört sandalye değil, iki bank — sabah kahvaltısı burada. Üstte wisteria pergola, yazın gölge, salkımlar masaya değer. Mutfak bahçesi etiketli: çakıl taşına yazılmış — rosemary, sage, thyme — el yazısı. Sebze yatakları yükseltilmiş, meşe kenar, içinde domates, taze fasulye, kabak, kenarda kadife çiçeği böcek için. Tek bir elma ağacı, Bramley, altına ahşap bank, sonbaharda elma toplar turta yaparsın. Köşede kompost kutusu, bakır sulama kabı, arı oteli — biçilmeyen 2 metrekare, yabani, kasıtlı. Her mevsim başka: ilkbahar wisteria ve lale, yaz gül ve lavanta hasadı, sonbahar elma ve sarmaşık kızarması, kış yosunlu taş ve bacadan duman.",details:["Ön bahçe: David Austin + yüksük otu + taş patika kekikli","Wisteria tüneli, Mayıs-Haziran, mor salkım","Patio: taş masa, wisteria pergola altı kahvaltı","Herb bahçesi etiketli: rosemary, sage, thyme, el yazısı taş","Sebze yatakları meşe, elma ağacı Bramley + bank","Kompost, bakır sulama, biçilmeyen yabani köşe 2m²"],mood:"Sabah kahvaltısı dışarıda, ayak altında kekik.",color:"#e6dbc6"}];function Xa(){let e=Re.useRef(null);return Re.useEffect(()=>{let n=e.current;if(!n)return;let t=new IntersectionObserver((r)=>{r.forEach((A)=>{if(A.isIntersecting)A.target.classList.add("in")})},{threshold:0.12});return n.querySelectorAll(".reveal").forEach((r)=>t.observe(r)),()=>t.dis
