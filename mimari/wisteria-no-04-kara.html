sif meşe tezgah — yıllandıkça güzelleşiyor. Tavandan sarkan bakır tavalar, açık raflarda kavanoz kavanoz kurutulmuş kekik, adaçayı, biberiye. Kahve değirmeni sabah ritüeli. Bulaşıklar için gizli bir köşe var, ortalık hep toplu kalıyor. Küçük ama bir şef mutfağı kadar ciddi.",details:["Mat siyah cephe, pirinç kulplar","Masif meşe tezgah + pirinç eviye","Açık meşe raflar — el yapımı seramikler","Tavandan asılı bakır tava askısı"]},{id:"ana-yatak",no:"04",name:"Ana Yatak Odası",size:"3.2 × 3.5m — loft’ta",image:eo,alt:"Loft yatak odası, üçgen pencere ve yün battaniye",lead:"Loft’ta, üçgen pencere, yün battaniye, orman manzarası, meşe gardırop.",text:"Merdivenle çıkılan loft, tam üçgen pencerenin önünde. Sabah uyanınca ilk gördüğün şey karlı çamlar ve mavi saat. Yerde kalın yün battaniye, başucunda küçük bir okuma lambası — pirinç, loş. Meşe gardırop kapakları eski bir İngiliz sandığını hatırlatıyor. Burası yazın da serin, kışın da sıcak. Yalıtım -30’a kadar testli, ama battaniyenin verdiği his yalıtımdan değil.",details:["Loft — 3.2×3.5m, alçak eğimli tavan","Üçgen panoramik orman penceresi","El dokuma yün battaniye + keten nevresim","Gömme meşe gardırop + sedir altı depolama"]},{id:"misafir",no:"05",name:"Misafir Odası",size:"2.8 × 3m — zemin katta",image:eo,alt:"Misafir odası okuma köşesi",lead:"Okuma köşesi, kar seyir penceresi.",text:"Zemin katta, biraz daha mahrem. Tek kişilik ama iki kişi rahat sığar. Köşede bir okuma koltuğu — kadife değil, yün. Yanında küçük bir sehpa, üstünde hep aynı kitap: Walden. Penceresi alçakta, oturunca karın yağışı tam göz hizanda. Misafirler genelde burada kalmak için bahane arıyor, gecesi ayrı güzel.",details:["2.8×3m — yalıtımlı kara kütük","Kar seyir penceresi — yerden 40cm","Okuma köşesi + pirinç lambader","Gizli yatak altı çekmeceleri"]},{id:"banyo",no:"06",name:"Banyo & Sauna",size:"4m² + 12m² ayrı sauna kulübesi",image:Us,alt:"Mat siyah küvet ve sauna detaylı banyo",lead:"Mat siyah küvet, pirinç batarya, kara ahşap duvar, büyük
