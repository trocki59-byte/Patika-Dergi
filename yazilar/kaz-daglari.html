t-[88px] leading-[0.9] tracking-[-0.03em] font-[800] max-w-[900px]",children:["KAZ DAĞLARI",s("span",{className:"block text-[20px] md:text-[28px] lg:text-[30px] leading-[1.15] font-[400] italic mt-4 md:mt-6 tracking-[-0.01em] max-w-[680px] text-[#e8e0d3]",children:"Bin Pınarlı İda'nın Doğasında Yaşam, Tarih ve Özgürlük"})]})]})]})}),s("div",{className:"sticky top-[64px] z-20 bg-[#fdfbf7]/90 backdrop-blur-xl border-b border-[#12261f]/10",style:{top:"calc(var(--safe-area-inset-top) + 64px)"},children:s("div",{className:"max-w-[1240px] mx-auto px-2 lg:px-10",children:s("div",{className:"flex gap-2 overflow-x-auto scrollbar-none py-3.5 px-4 lg:px-0",children:j7.map((e)=>s("a",{href:`#${e.id}`,className:"whitespace-nowrap px-4 py-2 rounded-full text-[12px] font-medium tracking-wide border border-[#12261f]/15 text-[#12261f]/80 hover:bg-[#12261f] hover:text-[#fdfbf7] hover:border-[#12261f] transition-all",children:e.label},e.id))})})}),L("main",{className:"max-w-[760px] mx-auto px-6 lg:px-0 pt-12 md:pt-16 pb-24",children:[L("div",{className:"relative bg-white border border-[#12261f]/10 rounded-[16px] p-7 md:p-9 shadow-[0_12px_40px_-20px_rgba(18,38,31,0.18)]",children:[s("div",{className:"absolute left-0 top-7 bottom-7 w-[3px] bg-[#2d5a27] rounded-full"}),s("p",{className:"serif text-[18px] md:text-[20px] leading-[1.6] text-[#12261f] font-[400]",children:"Bir dağın yalnızca taşlardan ve ağaçlardan oluşmadığını; suyun, toprağın, canlıların, efsanelerin ve insan hafızasının birleşerek nasıl bir dünya yarattığını anlamak için Kaz Dağları'na bakmak yeterlidir. Bu, sadece bir coğrafyaya değil, bir varoluş biçimine yapılan bir doğa yolculuğudur."}),s("p",{className:"mt-4 text-[14px] leading-[1.7] text-[#2b2b2b]/70",children:"Bu sayıda, mitolojiden ekolojiye, efsaneden mücadeleye uzanan İda'nın katmanlarını, Patika'nın orman temalı rotasında adım adım açıyoruz."})]}),s("div",{className:"leaf-divider",children:s("span",{className:"text-[#2d5a27] text-[18px]",children:"✦"})}),L("article",{className:"space-y-16",children:[L("section",{id:"hafiza",className:"scroll-mt-32",children:[s("h2",{className:"text-[28px] md:text-[36px] leading-[1.1] tracking-[-0.02em] font-bold text-[#12261f] mb-6",children:"DOĞANIN HAFIZASINA YOLCULUK"}),L("div",{className:"space-y-5 text-[16px] leading-[1.85] text-[#2b2b2b]",children:[s("p",{children:"Bazı coğrafyalar vardır; size sadece manzara göstermez, hatırlatır. Kaz Dağları tam da böyle bir hafıza mekânıdır. Binlerce yıllık göknarların kabuğunda, yosunların neminde, kayanın çatlağından sızan suyun sesinde birikir zaman. Burası, insanın kendini doğadan ayrı bir varlık olarak kurduğu modern yanılsamayı sessizce çözen bir yerdir."}),s("p",{children:"Mitoloji der ki, tanrılar buradan izlemiştir Truva Savaşı'nı. Ekoloji der ki, burası Avrupa ile Asya'nın buluştuğu bir sığınak, bir gen bankasıdır. Köylü der ki, dağ vermezse insan aç kalır. Üçü de aynı şeyi söyler aslında. İnsan bu dağlara çıktığında doğanın sahibi olmadığını, onun yalnızca bir parçası olduğunu yeniden hatırlar. Bu hatırlama, en kadim özgürlük biçimidir."}),s("p",{children:"Patika Dergi olarak rotamızı bu yüzden buraya çevirdik: Kaybolmak için değil, ait olduğumuz yeri yeniden bulmak için."})]})]}),L("section",{id:"nerede",className:"scroll-mt-32",children:[s("h2",{className:"text-[28px] md:text-[36px] leading-[1.1] tracking-[-0.02em] font-bold text-[#12261f] mb-6",children:"KAZ DAĞLARI NEREDEDİR?"}),L("div",{className:"space-y-5 text-[16px] leading-[1.85] text-[#2b2b2b]",children:[s("p",{children:"Anadolu'nun kuzeybatısında, Çanakkale ile Balıkesir sınırlarını çizen, Edremit Körfezi'ne bakan 1.774 metrelik bir kütle. Haritalarda Kaz Dağları, antik adıyla İda. Ama harita, gerçeğin yalnızca iskeletidir."}),s("p",{children:"Dağ, Biga Yarımadası'ndan başlayıp Madra'ya uzanan bir orman koridorunun kalbidir. Kuzeyde Marmara'nın serin rüzgârlarını, güneyde Ege'nin tuzlu esintisini taşır. Bu geçiş iklimi, onu Türkiye'nin en yüksek oksijen üretim alanlarından biri yapar. Köylerinde hâlâ su, saatle değil, ihtiyaca göre paylaşılır. Zeytinlikten çayıra, kestanelikten göknar kuşağına kadar dikey bir dünya kurulmuştur. Burada sınırları harita değil, yaşamın kendisi belirler."}),s("p",{children:"Ulaşım, Edremit üzerinden kıvrılan orman yolları ve antik patikalarla sağlanır. Asıl ulaşım ise yürüyerek olandır; çünkü Kaz Dağları arabayla geçilen değil, içinde kalınan bir yerdir."})]})]}),L("section",{id:"bin-pinarli",className:"scroll-mt-32",children:[s("h2",{className:"text-[28px] md:text-[36px] leading-[1.1] tracking-[-0.02em] font-bold text-[#12261f] mb-6",children:"BİN PINARLI İDA: TANRILARIN VE İNSANLARIN DAĞI"}),L("div",{className:"space-y-5 text-[16px] leading-[1.85] text-[#2b2b2b]",children:[s("p",{children:`Homeros, İlyada'da bu dağ için "çok pınarlı İda" der. Abartı değildir. Kaz Dağları, her vadisinden bir suyun doğduğu, her sırtından bir bulutun kalktığı bir su dağıdır. Antik çağda tanrıların insanları izlediği yer olarak anılması da bu yüceliktendir. Zeus'un tahtı buradadır, efsaneye göre. Gözlem yeri olarak seçilen dağ, aynı zamanda yargılama yeridir.`}),s("p",{children:"Dağın eteklerinde kurulu Thebe, Lyrnessos, Antandros gibi kentler, bu izlemenin tanıklarıdır. İnsanlar burada tanrılara yakın olmak için değil, onlarla pazarlık edebilmek için yaşamıştır. Adak taşları, sunu çukurları, bugün hâlâ orman içinde kaybolmuş halde bulunur."}),s("h3",{className:"serif text-[22px] font-semibold text-[#12261f] pt-4",children:"Paris'in Seçimi"}),s("p",{children:"İda'nın en bilinen efsanesi, Troya Prensi Paris'in üç tanrıça arasında yaptığı seçimdir. Hera, Athena ve Afrodit'in karşısına çıktığı yerin İda olduğu söylenir. Bu bir güzellik yarışmasından fazlasıdır; insanın iktidar, bilgelik ve arzu arasında yaptığı kadim seçimdir. Afrodit'i seçen Paris, aşkı seçer ama savaşı da başlatır. Mitoloji, Kaz Dağları'nın yamaçlarında hâlâ şu soruyu fısıldar: Ne uğruna neyi feda ediyoruz?"})]})]}),s("div",{className:"leaf-divider",children:s("span",{className:"text-[#2d5a27]",children:"\uD83C\uDF43"})}),L("section",{id:"gorunmeyen",className:"scroll-mt-32",children:[s("h2",{className:"text-[28px] md:text-[36px] leading-[1.1] tracking-[-0.02em] font-bold text-[#12261f] mb-6",children:"ORMANIN GÖRÜNMEYEN DÜNYASI"}),L("div",{className:"space-y-5 text-[16px] leading-[1.85] text-[#2b2b2b]",children:[s("p",{children:"Ormana baktığımızda ağaç görürüz. Oysa orman, ağaçların çok ötesindedir. Toprağın altında kilometrelerce uzanan mikoriza ağı, ağaçların birbirine besin ve bilgi aktardığı bir internet gibidir. Kaz Dağları'nın kuzey yamaçlarındaki yaşlı göknar ormanları, bu ağın en yoğun olduğu yerlerdir."}),s("p",{children:"Bir göknarın devrilmesi felaket değil, bir başlangıçtır. Gövdesi, yüzlerce böceğe, mantara, yosuna ev olur. Yosunlar suyu tutar, su toprağı tutar, toprak yeni bir fidanı tutar. Görünmeyen dünya, aslında en görünür olandır; sadece eğilip bakmak gerekir."}),s("p",{children:"Bu döngüyü bozduğunuzda, sadece bir ağaç değil, bir kütüphane yakmış olursunuz. Her yaşlı orman, kendi iklimini, kendi hafızasını taşır."})]}),L("figure",{className:"mt-8",children:[s("div",{className:"overflow-hidden rounded-[16px] shadow-[0_20px_60px_-24px_rgba(18,38,31,0.45)]",children:s("img",{src:VA,alt:"Kazdağı göknarının yosun kaplı kadim gövdesi",className:"w-full max-h-[600px] object-cover hover:scale-[1.02] transition-transform duration-700"})}),s("figcaption",{className:"mt-3 text-[13px] italic text-[#2b2b2b]/60 tracking-wide",children:"Kazdağı göknarının yosun kaplı kadim gövdesi — yaşamın birikme biçimi"})]})]}),L("section",{id:"goknari",className:"scroll-mt-32",children:[s("h2",{className:"text-[28px] md:text-[36px] leading-[1.1] tracking-[-0.02em] font-bold text-[#12261f] mb-6",children:"KAZDAĞI GÖKNARI: BİR AĞACIN GENETİK MİRASI"}),L("div",{className:"space-y-5 text-[16px] leading-[1.85] text-[#2b2b2b]",children:[L("p",{children:[s("em",{className:"serif text-[#12261f]",children:"Abies nordmanniana subsp. equi-trojani"})," — Adını Truva atlarından alan bu alt tür, dünyada sadece Kaz Dağları'nda yetişir. 30 metreyi aşan boyu, düzgün piramidal tacı ve kışın bile yeşil kalan iğneleriyle, dağın siluetini belirleyen ağaçtır."]}),s("p",{children:"Genetik araştırmalar, Kazdağı göknarının buzul çağlarından kalan bir relikt olduğunu gösteriyor. Yani iklimler değişirken, kıtalar kururken o burada kalmış, sığınmış ve evrimleşmiş. Bu yüzden tek bir ağaç değil, bir gen bankasıdır. Tohumları, kuraklığa ve hastalığa dayanıklılık genleri taşır; geleceğin ormanları için bir sigorta poliçesi gibidir."}),s("p",{children:"Ne yazık ki en büyük tehdidi de insan: Madencilik yolları için açılan kesimler, orman parçalanması ve iklim krizine bağlı kuraklık. Bir endemik türü kaybettiğinizde, sadece bir ağacı değil, milyon yıllık bir adaptasyon hikâyesini kaybedersiniz."})]})]}),L("section",{id:"endemik",className:"scroll-mt-32",children:[s("h2",{className:"text-[28px] md:text-[36px] leading-[1.1] tracking-[-0.02em] font-bold text-[#12261f] mb-6",children:"ENDEMİK BİTKİLERİN GİZLİ BAHÇESİ"}),L("div",{className:"space-y-5 text-[16px] leading-[1.85] text-[#2b2b2b]",children:[s("p",{children:"Kaz Dağları florasında yaklaşık 1000'e yakın takson bulunur ve bunların 32'si endemiktir. Bu sayı, bir milli park için olağanüstüdür. İda'nın kuzey yamaçları nemli, güney yamaçları kurak olduğu için birkaç kilometre içinde Akdeniz makisinden Karadeniz ormanına geçiş yaparsınız."}),L("p",{children:["Kazdağı çan çiçeği ",s("em",{children:"(Campanula idae)"}),", İda soğanı, Kazdağı kardeleni gibi türler sadece burada açar. İlkbaharda karlar erirken, orman tabanı adeta bir laboratuvar gibi çalışır; her endemik bitki, tozlaştırıcısı olan arı ve kelebekle birlikte uyanır. Bu birliktelik bozulursa, bitki de böcek de sessizce yok olur."]}),s("p",{children:"Gizli bahçe, gösterişli değildir. Çoğu endemik tür, diz hizasını geçmez. Onları görmek için eğilmek, yavaşlamak, beklemek gerekir. Tıpkı iyi bir hikâyeyi dinlemek gibi."})]})]}),L("section",{id:"yaban",className:"scroll-mt-32",children:[s("h2",{className:"text-[28px] md:text-[36px] leading-[1.1] tracking-[-0.02em] font-bold text-[#12261f] mb-6",children:"YABAN HAYATI"}),L("div",{className:"space-y-5 text-[16px] leading-[1.85] text-[#2b2b2b]",children:[s("p",{children:"Kaz Dağları'nda ayı izine rastlamak hâlâ mümkündür. Bozayı, kurt, karaca, yaban domuzu ve sansar, ormanın görünmeyen sahipleridir. Özellikle sonbaharda, meşe palamutlarının olgunlaştığı dönemde orman, büyük memelilerin beslenme koridoruna dönüşür."}),s("p",{children:"Kuşlar için ise İda, bir göç köprüsüdür. Kara akbaba, şahin, atmaca ve nadir görülen küçük orman kartalı burada ürer. Su kenarlarında su samuru izleri, kayalık sırtlarda kaya kartalı yuvaları bulunur. Yaban hayatı sayımları, dağın hâlâ sağlıklı bir ekosistem barındırdığını gösteriyor; ancak parçalanma, bu sağlığı hızla tehdit ediyor."}),s("p",{children:"Ormanda bir hayvan görmemek, onun yok olduğu anlamına gelmez. Çoğu zaman onlar sizi görür, siz onları değil. Yaban hayatı, gözlem değil, birlikte var olma pratiğidir."})]})]}),L("section",{id:"su",className:"scroll-mt-32",children:[s("h2",{className:"text-[28px] md:text-[36px] leading-[1.1] tracking-[-0.02em] font-bold text-[#12261f] mb-6",children:"SUYUN YOLCULUĞU"}),L("div",{className:"space-y-5 text-[16px] leading-[1.85] text-[#2b2b2b]",children:[s("p",{children:"Bin pınarlı sıfatı boşuna değil. Kaz Dağları, Mıhlı Çayı, Zeytinli Çayı, Kirazlı, Şahindere ve Manastır dereleri gibi onlarca su kaynağının doğduğu yerdir. Bu sular, Edremit Körfezi'nin zeytinliklerini, Çanakkale'nin tarım ovalarını besler."}),s("p",{children:"Suyun yolculuğu, dağın zirvesindeki kar erimesiyle başlar. Yosunlar suyu sünger gibi tutar, göknar kökleri toprağa sabitler, kanyonlar suyu yavaşlatır ve temizler. Bu doğal filtrasyon sistemi olmadan, aşağısı hem susuz hem de çamurlu kalır. Su, burada sadece bir kaynak değil, bir mimardır; vadileri, şelaleleri, yaşam alanlarını o yontar."}),s("p",{children:"İklim kriziyle birlikte bu döngü kırılıyor. Kar yağışının azalması, pınar debilerinin düşmesi, yaz kuraklıklarının uzaması demek. Suyu korumak, dağı korumaktan geçer."})]})]}),s("div",{className:"leaf-divider",children:s("span",{className:"text-[#2d5a27]",children:"◍"})}),L("section",{id:"sahindere",className:"scroll-mt-32",children:[s("h2",{className:"text-[28px] md:text-[36px] leading-[1.1] tracking-[-0.02em] font-bold text-[#12261f] mb-6",children:"ŞAHİNDERE KANYONU"}),L("div",{className:"space-y-5 text-[16px] leading-[1.85] text-[#2b2b2b]",children:[s("p",{children:"Kaz Dağları Milli Parkı'nın en dramatik kesiti: 26 kilometre uzunluğunda, yer yer 600 metre derinliğe ulaşan Şahindere Kanyonu. Sabahın ilk ışıklarında sis, kanyonun içinde bir nehir gibi akar. Şahinlerin yuva yaptığı sarp duvarlar, rüzgârın ve suyun binlerce yıllık işçiliğidir."}),s("p",{children:"Kanyon, sadece jeolojik bir oluşum değil, mikroklimatik bir sığınaktır. Duvarların gölgelediği bölümlerde nem hep yüksektir, bu yüzden eğrelti otları, orkideler ve yosun toplulukları kanyon tabanında yaşam bulur. Yürüyüş rotası, suyun sesini takip eder; her virajda yeni bir çağlayan, yeni bir havuz çıkar karşınıza."}),s("p",{children:"Burada sessizlik, boşluk değildir. Kayaların arasında yankılanan su, rüzgârın taşıdığı çam kokusu, uzaktan gelen bir çan sesi — hepsi bir arada bir orkestra kurar."})]}),L("figure",{className:"mt-8",children:[s("div",{className:"overflow-hidden rounded-[16px] shadow-[0_20px_60px_-24px_rgba(18,38,31,0.45)]",children:s("img",{src:BA,alt:"Gün doğumunda sisler arasındaki Şahindere Kanyonu",className:"w-full max-h-[600px] object-cover"})}),s("figcaption",{className:"mt-3 text-[13px] italic text-[#2b2b2b]/60 tracking-wide",children:"Gün doğumunda sisler arasındaki Şahindere Kanyonu — derinliğin ve sessizliğin coğrafyası"})]})]}),L("section",{id:"sutuven",className:"scroll-mt-32",children:[s("h2",{className:"text-[28px] md:text-[36px] leading-[1.1] tracking-[-0.02em] font-bold text-[#12261f] mb-6",children:"SÜTÜVEN ŞELALESİ VE HASANBOĞULDU"}),L("div",{className:"space-y-5 text-[16px] leading-[1.85] text-[#2b2b2b]",children:[s("p",{children:"Zeytinli Çayı'nın kalbi Sütüven Şelalesi'nde atar. Yaklaşık 20 metreden dökülen su, altındaki zümrüt havuzda toplanır. Yazın serinlemek için girenlerin çığlığı, kışın ise suyun kükreyişi aynı kayalarda yankılanır."}),s("p",{children:"Hemen yanı başındaki Hasanboğuldu göleti, bir efsaneyi taşır. Rivayete göre sevdiğine kavuşamayan Hasan, kendini bu azgın sulara bırakmıştır. Göletin adı bu acıdan gelir. Doğa burada sadece fiziksel değil, duygusal bir mekândır da. İnsanlar, kendi hikâyelerini suya bırakır, su da onları taşır."}),s("p",{children:"Sütüven, koruma ve kullanım dengesinin en hassas olduğu yerlerden biridir. Aşırı ziyaretçi baskısı, kıyı erozyonu ve çöp, bu kırılgan güzelliği hızla tüketebilir. İz bırakmadan geçmek, burada en büyük saygı biçimidir."})]}),L("figure",{className:"mt-8",children:[s("div",{className:"overflow-hidden rounded-[16px] shadow-[0_20px_60px_-24px_rgba(18,38,31,0.45)]",children:s("img",{src:SA,alt:"Kaz Dağları'nın kalbi Sütüven Şelalesi",className:"w-full max-h-[600px] object-cover"})}),s("figcaption",{className:"mt-3 text-[13px] italic text-[#2b2b2b]/60 tracking-wide",children:"Kaz Dağları'nın kalbi Sütüven Şelalesi — suyun hafızası ve efsanesi"})]})]}),L("section",{id:"sarikiz",className:"scroll-mt-32",children:[s("h2",{className:"text-[28px] md:text-[36px] leading-[1.1] tracking-[-0.02em] font-bold text-[#12261f] mb-6",children:"SARIKIZ EFSANESİ"}),L("div",{className:"space-y-5 text-[16px] leading-[1.85] text-[#2b2b2b]",children:[s("p",{children:"Kaz Dağları'nın zirvesine yakın bir yerde, Sarıkız Tepesi vardır. Efsaneye göre güzelliğiyle dillere destan bir kız, iftiraya uğrar ve babası tarafından dağa bırakılır. Dağda kaz çobanlığı yaparken ermiş mertebesine ulaşır. Babası yıllar sonra pişman olup kızını aramaya geldiğinde, Sarıkız çoktan bir efsaneye
