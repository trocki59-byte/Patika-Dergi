name: Kars gezi rehberini aynen yayinla

on:
  push:
    branches: [main]
    paths:
      - '.kars-source/ready.txt'

permissions:
  contents: write

jobs:
  restore-original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Orijinal HTML dosyasini birebir birlestir ve dogrula
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p yazilar
          cat .kars-source/part-* > yazilar/Kars-Gezi-Rehberi-Bozk.html
          printf '%s  %s\n' '99af597cdeffa966b5eb7be2104f7de54844614d4a357ccc060f5bdd63a1d5b0' 'yazilar/Kars-Gezi-Rehberi-Bozk.html' | sha256sum -c -

      - name: HTML dosyasini depoya koy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yazilar/Kars-Gezi-Rehberi-Bozk.html
          git rm -r .kars-source
          git commit -m "Publish original Kars travel guide unchanged"
          git push origin HEAD:main
